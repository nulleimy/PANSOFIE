name: Verify R5 Browser V2

on:
  push:
    branches:
      - verify/partner-review-adoption-outcome-r5-browser-v2
  pull_request:
    branches:
      - feat/partner-review-adoption-outcome-r5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-r5-browser-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r5-browser-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PANSOFIE_LOCAL_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact inherited R5 product head
        run: |
          git merge-base --is-ancestor 32bf26bf695806f0088d57841d65cf9cb196de91 HEAD
          test "$(git diff --name-only 32bf26bf695806f0088d57841d65cf9cb196de91...HEAD | grep -v '^tests/e2e/partner-review-r5-browser.spec.mjs$' | grep -v '^.github/workflows/verify-r5-browser-v2.yml$' | wc -l | tr -d ' ')" = "0"
      - name: Install app dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start exact R5 source locally
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pansofie-r5-v2-vite.log 2>&1 &
          echo $! > /tmp/pansofie-r5-v2-vite.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then echo "LOCAL_R5_V2=READY"; exit 0; fi
            sleep 1
          done
          cat /tmp/pansofie-r5-v2-vite.log
          exit 1
      - name: Run Partner and School desktop/mobile acceptance
        run: npx playwright test tests/e2e/partner-review-r5-browser.spec.mjs --reporter=line
      - name: Upload R5 exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pansofie-r5-browser-evidence-v2
          path: |
            browser-evidence-r5/
            test-results/
            /tmp/pansofie-r5-v2-vite.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local Vite
        if: always()
        run: |
          if [ -f /tmp/pansofie-r5-v2-vite.pid ]; then kill "$(cat /tmp/pansofie-r5-v2-vite.pid)" || true; fi
