name: Verify PR48 Visual Reference

on:
  push:
    branches:
      - verify/pr48-visual-reference

permissions:
  contents: read

jobs:
  chromium-visual-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PANSOFIE_PR_PREVIEW_URL: https://pansofie-staging-mcvmy6a5h-voodoo-caser.vercel.app/?_vercel_share=UMkC2n10DlDjv0LZz1Fr4bExdJ0trwoa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile proof
        run: npx playwright test tests/e2e/public-ui-visual-reference.spec.mjs --reporter=line --workers=1

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pansofie-pr48-exact-head-visual-reference
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
