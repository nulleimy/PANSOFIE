name: Canonical Staging Browser Proof

on:
  pull_request:
    paths:
      - ".github/workflows/canonical-staging-browser-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pansofie-canonical-staging-browser-proof
  cancel-in-progress: true

jobs:
  canonical-staging-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Verification-only trigger: post-R5 canonical staging proof.
      PANSOFIE_STAGING_URL: https://pansofie-staging.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify proof scope
        run: |
          echo "CANONICAL_STAGING_URL=$PANSOFIE_STAGING_URL"
          echo "This workflow tests the canonical staging alias, not a PR preview URL."

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Allow canonical staging alias to settle
        run: sleep 15

      - name: Run canonical staging Chromium acceptance
        run: npx playwright test tests/e2e/pilot-staging.spec.mjs tests/e2e/public-completion.spec.mjs tests/e2e/partner-challenge-r4.spec.mjs --reporter=line --retries=1

      - name: Upload canonical staging browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pansofie-canonical-staging-r4-browser-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
