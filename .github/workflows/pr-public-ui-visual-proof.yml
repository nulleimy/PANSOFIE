name: PR Public UI Visual Proof

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact Vercel preview/share URL to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pansofie-public-ui-visual-proof
  cancel-in-progress: true

jobs:
  chromium-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PANSOFIE_PR_PREVIEW_URL: ${{ inputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop and mobile visual proof
        run: npx playwright test tests/e2e/public-ui-visual-reference.spec.mjs --reporter=line --workers=1

      - name: Upload visual proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pansofie-public-ui-visual-proof
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
