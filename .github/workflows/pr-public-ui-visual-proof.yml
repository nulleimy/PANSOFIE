name: PR Public UI Visual Proof

on:
  pull_request:
    paths:
      - ".github/workflows/pr-public-ui-visual-proof.yml"

permissions:
  contents: read

jobs:
  chromium-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PANSOFIE_PR_PREVIEW_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact-source Vite preview
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pansofie-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pansofie-vite.log
          exit 1

      - name: Capture desktop and mobile visual proof
        run: npx playwright test tests/e2e/public-ui-visual-reference.spec.mjs --reporter=line --workers=1

      - name: Upload visual proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pansofie-pr48-local-exact-source-visual-proof
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
